<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101426"><title>ONE JUMP</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101426;color:#f5f1ff;font-family:monospace;touch-action:none}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 15%,#252d54,#101426 70%)}#app{width:min(100vw,520px);height:100dvh;max-height:900px;display:flex;flex-direction:column;padding:12px;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:#a9b5e8}.logo{font-size:clamp(25px,7vw,38px);font-weight:900;letter-spacing:4px;color:#fff;text-shadow:3px 3px #6652d9}.logo span{color:#9c8cff}#stage{position:relative;flex:1;min-height:0;border:3px solid #6671a8;box-shadow:0 0 0 3px #202743,0 10px 35px #0008;background:#131a31;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#overlay{position:absolute;inset:0;background:#0c1020d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}#overlay.hidden{display:none}.headline{font-size:25px;letter-spacing:2px;text-shadow:3px 3px #5949b6}.sub{font-size:12px;line-height:1.7;color:#bbc4ee;max-width:270px}button{font: bold 13px monospace;letter-spacing:1px;color:white;background:#6253ce;border:0;border-bottom:4px solid #342a82;padding:13px 18px;min-height:44px}button:active{transform:translateY(2px);border-bottom-width:2px}.controls{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;height:74px;flex-shrink:0}.controls button{font-size:20px;background:#242d50;border:2px solid #56639c;border-bottom-width:5px;padding:0}.controls .jump{background:#6554d4;border-color:#9a8cff;border-bottom-color:#342a82;font-size:14px}.hint{text-align:center;font-size:10px;color:#8995c5;letter-spacing:1px;padding-bottom:2px}
</style></head><body><main id="app"><div class="top"><span>PIXEL PLATFORMER</span><span id="levelLabel">FASE 1 / 5</span></div><div class="logo">ONE <span>JUMP</span></div><div id="stage"><canvas id="game" width="320" height="480" aria-label="Jogo ONE JUMP"></canvas><div id="overlay"><div class="headline" id="ovTitle">ONE JUMP</div><div class="sub" id="ovText">Um salto pode mudar tudo.<br>Supere 5 fases e chegue ao portal.</div><button id="mainBtn">JOGAR</button><div class="sub">MOVER: ◀ ▶ &nbsp; PULAR: BOTÃO ROXO</div></div></div><div class="controls"><button id="left" aria-label="Mover para esquerda">◀</button><button id="right" aria-label="Mover para direita">▶</button><button id="jump" class="jump">PULAR ↑</button></div><div class="hint">ENCONTRE O PORTAL · EVITE OS ESPINHOS</div></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),mainBtn=document.getElementById('mainBtn'),levelLabel=document.getElementById('levelLabel');ctx.imageSmoothingEnabled=false;
const W=320,H=480,keys={left:false,right:false},levels=[
{start:[24,390],plats:[[0,430,95,50],[125,385,65,16],[220,330,65,16],[275,250,45,16]],spikes:[[65,414,24,16],[148,369,20,16],[235,314,20,16]],portal:[288,204]},
{start:[18,390],plats:[[0,430,70,50],[95,385,52,16],[170,340,55,16],[95,285,55,16],[190,230,55,16],[265,180,55,16]],spikes:[[42,414,22,16],[108,369,20,16],[188,324,20,16],[110,269,20,16],[207,214,20,16]],portal:[286,134]},
{start:[20,390],plats:[[0,430,75,50],[105,390,42,16],[180,350,42,16],[120,300,42,16],[205,255,42,16],[260,205,60,16]],spikes:[[50,414,20,16],[115,374,18,16],[190,334,18,16],[132,284,18,16],[216,239,18,16]],portal:[287,159]},
{start:[20,390],plats:[[0,430,65,50],[90,390,38,16],[150,345,38,16],[215,300,38,16],[145,250,38,16],[220,205,38,16],[275,160,45,16]],spikes:[[36,414,20,16],[99,374,18,16],[159,329,18,16],[224,284,18,16],[154,234,18,16],[229,189,18,16]],portal:[292,114]},
{start:[20,390],plats:[[0,430,60,50],[85,390,35,16],[145,350,35,16],[205,310,35,16],[145,265,35,16],[205,220,35,16],[260,175,60,16]],spikes:[[30,414,20,16],[91,374,18,16],[151,334,18,16],[211,294,18,16],[151,249,18,16],[211,204,18,16]],portal:[286,129]}
];
let level=0,player,playing=false,won=false,cam=0,frame=0,best=Number(localStorage.getItem('onejump_best')||0),deaths=0;
function reset(){const s=levels[level].start;player={x:s[0],y:s[1],w:14,h:18,vx:0,vy:0,on:false};cam=0}
function start(){level=0;deaths=0;reset();playing=true;overlay.classList.add('hidden');levelLabel.textContent='FASE 1 / 5';}
function show(title,text,button){playing=false;ovTitle.textContent=title;ovText.innerHTML=text;mainBtn.textContent=button;overlay.classList.remove('hidden')}
mainBtn.onclick=()=>{if(won){start();return}if(!playing) {if(ovTitle.textContent==='VOCÊ CONSEGUIU!')start();else {reset();playing=true;overlay.classList.add('hidden')}}};
function bind(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture?.(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false})}
bind('left','left');bind('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(playing&&player.on){player.vy=-8.5;player.on=false}});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&playing&&player.on){player.vy=-8.5;player.on=false}if(e.key==='Escape'&&playing)show('PAUSADO','Respire e tente novamente.','CONTINUAR')});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){ctx.clearRect(0,0,W,H);rect(0,0,W,H,'#151b35');for(let i=0;i<40;i++){let x=(i*71+17)%W,y=(i*47+11)%H;rect(x,y,2,2,i%3?'#303b67':'#9b91dc')}for(let y=0;y<H;y+=32)rect(0,y,W,1,'#202947');
const l=levels[level];l.plats.forEach(([x,y,w,h],i)=>{rect(x,y,w,h,'#4a5183');rect(x,y,w,4,'#9d9bf2');for(let k=5;k<w;k+=12)rect(x+k,y+7,4,3,'#6872a8');});
l.spikes.forEach(([x,y,w,h])=>{ctx.fillStyle='#ff617d';ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.fill();rect(x,y+h-3,w,3,'#b63760')});
const [px,py]=l.portal;rect(px,py,18,28,'#5de7dd');rect(px+4,py+4,10,20,'#a2fff1');rect(px+7,py+8,4,12,'#554fc2');rect(px-3,py+24,24,4,'#5de7dd');
if(player){let x=player.x,y=player.y;rect(x+2,y+2,10,5,'#f2bd91');rect(x+1,y+7,12,8,'#8c79f6');rect(x+2,y+15,4,3,'#f5f0ff');rect(x+9,y+15,4,3,'#f5f0ff');rect(x+1,y,12,3,'#e7e4ff');rect(x+10,y+4,2,2,'#1b203d');}
rect(8,8,100,20,'#0b1028');ctx.fillStyle='#dce2ff';ctx.font='10px monospace';ctx.fillText('MORTES: '+deaths,14,21);ctx.fillText('RECORDE: '+best,215,21);
}
function collide(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}
function update(){if(playing){const l=levels[level];player.vx=(keys.right?2.2:0)-(keys.left?2.2:0);player.x+=player.vx;player.x=Math.max(0,Math.min(W-player.w,player.x));player.vy=Math.min(9,player.vy+.38);let oldY=player.y;player.y+=player.vy;player.on=false;if(player.vy>=0){for(const p of l.plats){if(oldY+player.h<=p[1]&&player.y+player.h>=p[1]&&player.x+player.w>p[0]&&player.x<p[0]+p[2]){player.y=p[1]-player.h;player.vy=0;player.on=true;break}}}for(const s of l.spikes){if(collide(player,s)){deaths++;reset();break}}if(player.y>H+30){deaths++;reset()}if(player.x+player.w>l.portal[0]&&player.x<l.portal[0]+18&&player.y+player.h>l.portal[1]&&player.y<l.portal[1]+28){if(level<levels.length-1){level++;levelLabel.textContent='FASE '+(level+1)+' / 5';reset()}else{won=true;best=Math.max(best,Math.max(0,1000-deaths*50));localStorage.setItem('onejump_best',best);show('VOCÊ CONSEGUIU!','Você completou as 5 fases!<br>Mortes: '+deaths+' · Recorde: '+best,'JOGAR NOVAMENTE')}}}draw();requestAnimationFrame(update)}
reset();draw();requestAnimationFrame(update);
})();
</script></body></html>
