<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b20"><title>ONE JUMP</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b1b;color:#f4f2ff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;touch-action:none}body{display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#29265a 0,#10152f 42%,#070918 100%)}#app{width:min(100vw,520px);height:100dvh;max-height:950px;display:flex;flex-direction:column;padding:10px 12px;gap:7px}.top{display:flex;justify-content:space-between;align-items:center;color:#9da9e7;font-size:10px;letter-spacing:2px}.top b{color:#d9d5ff}.brandrow{display:flex;align-items:center;justify-content:space-between;min-height:42px}.logo{font-size:clamp(28px,8vw,39px);font-weight:1000;letter-spacing:4px;color:#fff;text-shadow:3px 3px 0 #3b2c8d,5px 5px 0 #11152d}.logo span{color:#a99bff}.tinybtn{min-height:38px;min-width:42px;padding:7px 10px;border:1px solid #55599c;border-bottom:3px solid #30255e;background:#171b3d;color:#e9e5ff;font:12px monospace;border-radius:3px}#stage{position:relative;flex:1;min-height:0;border:2px solid #555c9b;box-shadow:0 0 0 3px #161a38,0 14px 34px #0008;background:#0b1027;overflow:hidden;border-radius:3px}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#overlay{position:absolute;inset:0;background:linear-gradient(180deg,#090d22d9,#11102ddd);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:13px}#overlay.hidden{display:none}.headline{font-size:clamp(23px,7vw,30px);letter-spacing:2px;text-shadow:3px 3px #493a9d;color:#fff}.sub{font-size:12px;line-height:1.8;color:#c3c8ef;max-width:275px}button{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}.primary{font:bold 13px monospace;letter-spacing:2px;color:#fff;background:#6d5ce5;border:1px solid #b0a6ff;border-bottom:4px solid #3d2e9a;padding:13px 22px;min-height:46px;border-radius:3px;box-shadow:0 0 18px #6755e544}.primary:active,.controls button:active{transform:translateY(2px);filter:brightness(1.2)}.controls{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:8px;height:68px;flex-shrink:0}.controls button{font-size:22px;color:#f4f1ff;background:linear-gradient(#20264b,#151a38);border:1px solid #5664a1;border-bottom:4px solid #30365f;border-radius:4px;padding:0;min-height:54px}.controls .jump{font-size:14px;font-weight:bold;letter-spacing:1px;background:linear-gradient(#7865f1,#5140c0);border-color:#b7aaff;border-bottom-color:#33247e}.hint{text-align:center;font-size:9px;color:#838fc6;letter-spacing:1.2px;padding-bottom:2px}.badge{color:#7cf6e1}
</style></head>
<body><main id="app">
<div class="top"><span><b>PIXEL PLATFORMER</b> · ARCADE</span><span id="levelLabel">FASE 1 / 5</span></div>
<div class="brandrow"><div class="logo">ONE <span>JUMP</span></div><button class="tinybtn" id="soundBtn" aria-label="Ativar ou desativar som">SOM: ON</button></div>
<div id="stage"><canvas id="game" width="320" height="480" aria-label="Jogo ONE JUMP"></canvas><div id="overlay"><div class="headline" id="ovTitle">ONE JUMP</div><div class="sub" id="ovText">Um salto. Cinco fases.<br>Alcance o portal e não caia nos espinhos.</div><button class="primary" id="mainBtn">JOGAR</button><div class="sub">SEGURE ◀ ▶ PARA ANDAR<br><span class="badge">SEGURE PULAR PARA SALTAR MAIS ALTO</span></div></div></div>
<div class="controls"><button id="left" aria-label="Mover para esquerda">◀</button><button id="right" aria-label="Mover para direita">▶</button><button id="jump" class="jump" aria-label="Pular">PULAR ↑</button></div>
<div class="hint">ALCANCE O PORTAL · EVITE OS ESPINHOS · 5 FASES</div></main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),mainBtn=document.getElementById('mainBtn'),levelLabel=document.getElementById('levelLabel'),soundBtn=document.getElementById('soundBtn');
ctx.imageSmoothingEnabled=false;const W=320,H=480,keys={left:false,right:false,jump:false};
const levels=[
{start:[24,390],plats:[[0,430,95,50],[125,385,65,16],[220,330,65,16],[275,250,45,16]],spikes:[[65,414,24,16],[148,369,20,16],[235,314,20,16]],portal:[288,204]},
{start:[18,390],plats:[[0,430,70,50],[95,385,52,16],[170,340,55,16],[95,285,55,16],[190,230,55,16],[265,180,55,16]],spikes:[[42,414,22,16],[108,369,20,16],[188,324,20,16],[110,269,20,16],[207,214,20,16]],portal:[286,134]},
{start:[20,390],plats:[[0,430,75,50],[105,390,42,16],[180,350,42,16],[120,300,42,16],[205,255,42,16],[260,205,60,16]],spikes:[[50,414,20,16],[115,374,18,16],[190,334,18,16],[132,284,18,16],[216,239,18,16]],portal:[287,159]},
{start:[20,390],plats:[[0,430,65,50],[90,390,38,16],[150,345,38,16],[215,300,38,16],[145,250,38,16],[220,205,38,16],[275,160,45,16]],spikes:[[36,414,20,16],[99,374,18,16],[159,329,18,16],[224,284,18,16],[154,234,18,16],[229,189,18,16]],portal:[292,114]},
{start:[20,390],plats:[[0,430,60,50],[85,390,35,16],[145,350,35,16],[205,310,35,16],[145,265,35,16],[205,220,35,16],[260,175,60,16]],spikes:[[30,414,20,16],[91,374,18,16],[151,334,18,16],[211,294,18,16],[151,249,18,16],[211,204,18,16]],portal:[286,129]}
];
let level=0,player,playing=false,won=false,best=Number(localStorage.getItem('onejump_best')||0),deaths=0,frame=0,particles=[],audio=null,soundOn=true,jumpBuffer=0,coyote=0;
function audioReady(){if(!soundOn)return null;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
function tone(freq,dur,type='square',vol=.035,slide=0){const a=audioReady();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+dur);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function sfx(kind){if(kind==='jump'){tone(320,.11,'square',.035,280)}else if(kind==='land'){tone(115,.055,'triangle',.025,-35)}else if(kind==='death'){tone(220,.22,'sawtooth',.035,-150)}else if(kind==='portal'){tone(440,.12,'square',.03,220);setTimeout(()=>tone(660,.18,'square',.025,280),75)}else if(kind==='win'){tone(440,.12,'square');setTimeout(()=>tone(550,.12,'square'),110);setTimeout(()=>tone(660,.22,'square'),220)}}
function burst(x,y,color,count=12){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=.7+Math.random()*2.4;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:18+Math.random()*18,max:36,size:2+Math.floor(Math.random()*3),color})}}
function reset(){const s=levels[level].start;player={x:s[0],y:s[1],w:14,h:18,vx:0,vy:0,on:false,face:1,anim:0};jumpBuffer=0;coyote=0}
function start(){level=0;deaths=0;won=false;reset();playing=true;levelLabel.textContent='FASE 1 / 5';overlay.classList.add('hidden');audioReady();tone(520,.08,'square',.02,100)}
function show(title,text,button){playing=false;ovTitle.textContent=title;ovText.innerHTML=text;mainBtn.textContent=button;overlay.classList.remove('hidden')}
mainBtn.addEventListener('click',()=>{audioReady();if(won||ovTitle.textContent==='VOCÊ CONSEGUIU!')start();else if(ovTitle.textContent==='PAUSADO'){playing=true;overlay.classList.add('hidden')}else start()});
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'SOM: ON':'SOM: OFF';if(soundOn){audioReady();tone(520,.07)}});
function bindMove(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();audioReady();keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});const release=e=>{e.preventDefault();keys[key]=false};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,release))}
bindMove('left','left');bindMove('right','right');const jumpEl=document.getElementById('jump');
jumpEl.addEventListener('pointerdown',e=>{e.preventDefault();audioReady();keys.jump=true;jumpBuffer=8;try{jumpEl.setPointerCapture(e.pointerId)}catch(_){}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>jumpEl.addEventListener(ev,e=>{e.preventDefault();keys.jump=false;if(player&&player.vy< -3)player.vy*=.58}));
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){audioReady();keys.jump=true;jumpBuffer=8}if(e.key==='Escape'&&playing)show('PAUSADO','Toque continuar quando quiser voltar.','CONTINUAR')});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){keys.jump=false;if(player&&player.vy< -3)player.vy*=.58}});
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#151d48');sky.addColorStop(.65,'#171533');sky.addColorStop(1,'#090d22');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
for(let i=0;i<48;i++){const x=(i*67+13)%W,y=(i*43+19)%H;rect(x,y,((i%5)===0?3:1),((i%5)===0?3:1),i%4===0?'#a8a0ff':'#6574b0')}
ctx.globalAlpha=.35;for(let layer=0;layer<3;layer++){ctx.fillStyle=['#292a60','#222653','#1a2048'][layer];ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=16){const y=245+layer*42+Math.sin(x*.025+layer*2+frame*.004)*18+(x%3)*3;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.fill()}ctx.globalAlpha=1;
for(let y=0;y<H;y+=32)rect(0,y,W,1,'#ffffff08');
const l=levels[level];
l.plats.forEach(([x,y,w,h],i)=>{rect(x,y+4,w,h,'#292c61');rect(x,y,w,h,'#464b8b');rect(x,y,w,4,'#a4a0ff');rect(x+3,y+5,Math.max(0,w-6),2,'#6c72bb');for(let k=7;k<w-4;k+=14){rect(x+k,y+9,4,3,'#353c72');rect(x+k+2,y+12,2,2,'#5e65a5')}if(i%2===0)rect(x+4,y-3,Math.min(9,w-8),2,'#73e7d7')});
l.spikes.forEach(([x,y,w,h])=>{ctx.fillStyle='#ff557e';ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.fill();rect(x+2,y+h-3,w-4,3,'#b82e62');rect(x+w/2-1,y+5,2,4,'#ffd3e0')});
const [px,py]=l.portal;const glow=5+Math.sin(frame*.12)*2;ctx.globalAlpha=.18;rect(px-glow,py-glow,18+glow*2,28+glow*2,'#5df8e3');ctx.globalAlpha=1;rect(px-3,py-2,24,32,'#2c6e9c');rect(px,py,18,28,'#63f4e2');rect(px+3,py+3,12,22,'#bafff6');rect(px+7,py+6,4,15,'#5a49b8');rect(px+5,py+8,2,10,'#fff');rect(px-4,py+24,26,4,'#8affef');
if(player){const x=Math.round(player.x),y=Math.round(player.y),bob=player.on&&Math.abs(player.vx)>.3?Math.sin(player.anim*.8)*1.5:0;rect(x+1,y+5+bob,13,12,'#6e4bd1');rect(x+2,y+2+bob,10,7,'#f0b78c');rect(x+1,y+bob,12,4,'#d9ddff');rect(x+3,y+8+bob,8,5,'#a88cff');rect(x+(player.face>0?10:2),y+4+bob,2,2,'#12182f');rect(x+2,y+16,4,2,'#f5efff');rect(x+9,y+16,4,2,'#f5efff');rect(x+(player.face>0?0:12),y+8+bob,2,4,'#58e7d6');}
particles=particles.filter(p=>p.life>0);for(const p of particles){rect(p.x,p.y,p.size,p.size,p.color);p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--}
rect(8,8,107,23,'#080c23cc');rect(8,8,2,23,'#8d82ff');ctx.fillStyle='#e5e8ff';ctx.font='10px monospace';ctx.fillText('MORTES '+deaths,16,22);ctx.fillStyle='#9af5e3';ctx.fillText('RECORDE '+best,222,22);
}
function collide(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}
function die(){deaths++;burst(player.x+7,player.y+9,'#ff628c',16);sfx('death');reset()}
function update(){frame++;if(playing){const l=levels[level],oldY=player.y;const target=(keys.right?1:0)-(keys.left?1:0);if(target){player.vx+=target*.42;player.vx=Math.max(-3.25,Math.min(3.25,player.vx));player.face=target}else player.vx*=.78;if(Math.abs(player.vx)<.08)player.vx=0;player.x+=player.vx;player.x=Math.max(0,Math.min(W-player.w,player.x));player.vy=Math.min(10,player.vy+.34);player.y+=player.vy;player.on=false;
if(player.vy>=0){for(const p of l.plats){if(oldY+player.h<=p[1]+2&&player.y+player.h>=p[1]&&player.x+player.w>p[0]+2&&player.x<p[0]+p[2]-2){player.y=p[1]-player.h;player.vy=0;player.on=true;break}}}
if(player.on)coyote=7;else coyote=Math.max(0,coyote-1);if(jumpBuffer>0)jumpBuffer--;if(jumpBuffer>0&&coyote>0){player.vy=-8.7;player.on=false;coyote=0;jumpBuffer=0;burst(player.x+player.w/2,player.y+player.h,'#9c8dff',5);sfx('jump')}
if(player.on&&Math.abs(player.vx)>.7&&frame%8===0)burst(player.x+player.w/2,player.y+player.h,'#8586df',2);if(!keys.jump&&player.vy< -3)player.vy*=.96;player.anim+=Math.abs(player.vx);
for(const s of l.spikes){if(collide(player,s)){die();break}}if(player.y>H+30)die();
if(player.x+player.w>l.portal[0]&&player.x<l.portal[0]+18&&player.y+player.h>l.portal[1]&&player.y<l.portal[1]+28){burst(l.portal[0]+9,l.portal[1]+14,'#7effeb',22);sfx('portal');if(level<levels.length-1){level++;levelLabel.textContent='FASE '+(level+1)+' / 5';reset()}else{won=true;best=Math.max(best,Math.max(0,1000-deaths*50));localStorage.setItem('onejump_best',String(best));sfx('win');show('VOCÊ CONSEGUIU!','Você completou as 5 fases!<br>Mortes: '+deaths+' · Recorde: '+best,'JOGAR NOVAMENTE')}}}
draw();requestAnimationFrame(update)}
reset();draw();requestAnimationFrame(update);
})();
</script></body></html>
